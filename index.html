<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentilytics - Home</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script type="module" src="assets/js/main.js"></script>
</head>
<body>
   <aside class="sidebar">
        <div class="nav-links">
            <a href="index.html" class="active"><i class="fa-solid fa-table-columns"></i>   Dashboard</a>
            <a href="registration.html"><i class="fa-solid fa-user-plus"></i>   Registration</a>
            <a href="team.html"><i class="fa-solid fa-users"></i>   Team</a>
            <a href="feedback.html"><i class="fa-solid fa-comments"></i>   Feedback</a>
        </div>
    </aside>
    <header class="top-header">
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
            <h1>𝚂𝚎𝚗𝚝𝚒𝚕𝚢𝚝𝚒𝚌𝚜</h1>
        </div>
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <div class="iconn">
            <button class="light">☀️</button>
            <button class="dark">🌙</button>
        </div>
    </header>
    <main class="container">
        <div class="hero-slider">
            <div class="slide active">
                <img src="assets/img/hero-1.png" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="assets/img/hero-2.png" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="assets/img/hero-3.png" alt="Slide 3">
            </div>
        </div>

        <section class="upload">
            <h2><i class="fa-solid fa-cloud-arrow-up"></i> Upload Files for Analysis</h2>
            <p>Upload your .txt files to get started with sentiment analysis and summarization.</p>

            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div class="drop-zone-inner">
                    <div class="icon">📄</div>
                    <h3>Drag & drop your files here or click to browse</h3>
                    <p>or click "Choose File" to browse</p>
                    <input type="file" id="fileInput" accept=".txt" hidden>
                </div>
            </div>

            <button type="button" class="btn" onclick="document.getElementById('fileInput').click()">
                Choose File
            </button>
            <button type="submit" class="btn">Upload</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sentilytics. All Rights Reserved.</p>
    </footer>
</body>
</html>
